name: Engineering Tools CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/engineering-tools/**"
      - ".github/workflows/engineering-tools-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/engineering-tools/**"
      - ".github/workflows/engineering-tools-ci.yml"

permissions:
  contents: read

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/engineering-tools
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Engineering Tools
        run: npm run build
